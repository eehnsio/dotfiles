# ============================================================
# tmux — bas, delad mellan Macen och flottan.
# Redigera i dotfiles-repot (tmux/.tmux.conf), ALDRIG i ~/.
# Värdspecifika tillägg hör hemma i ~/.tmux.conf.local, som
# sourceas sist — samma mönster som ~/.zshrc.local.
# ============================================================

# ── Beteende ────────────────────────────────────────────────
set -g mouse on                # svep för att scrolla — avgörande på mobil
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -sg escape-time 10         # annars fördröjs ESC i nvim
set -g focus-events on
set -g renumber-windows on

# ── Terminal ────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"

# ── Tema ────────────────────────────────────────────────────
# Statusraden bor här. Medvetet naken tills temat är på plats —
# hellre tom än en färgsättning som krockar med det du bygger.
#
# status-position top: mobilterminalers tangentbordsfält skymmer
# nedersta raden. Flytta hit ner om du hellre vill ha den nertill
# på Macen och överst bara på servrarna (då: sätt den i .local).
set -g status-position top
set -g status-justify left
set -g status-style default
set -g status-right ""

# Prefix-indikator. tmux kvitterar som standard INTE att prefixet är nedtryckt,
# vilket får `Ctrl-b` att kännas trasigt när ingenting händer. ^B tänds till
# vänster så länge tmux väntar på nästa tangent.
set -g status-left "#{?client_prefix,#[reverse] ^B #[default] ,}"
set -g status-left-length 20

# Aktivt fönster. Utan detta skiljs det bara av ett `*` — i praktiken osynligt
# när man har flera fönster igång.
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style reverse
set -g window-status-style default
set -g window-status-separator ""

# reverse i stället för fasta färger: inverterar temats egna, så både
# indikatorn och det aktiva fönstret överlever vilket tema du än bygger.

# ── Värdspecifikt ───────────────────────────────────────────
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
