[terminal]
vt = 1

# nwg-hello i en egen niri-instans. Ingen autologin: utan losenord kan
# pam_gnome_keyring inte lasa upp keyringen, och disken ar okrypterad.
#
# Filen heter greetd.conf och inte config.toml med flit. greetd letar efter
# greetd.conf FORST (bada strangarna finns i binaren), och config.toml skrivs
# over vid paketuppgradering - da blir den egna versionen .pacsave och agreety
# kommer tillbaka.
[default_session]
command = "niri -c /etc/nwg-hello/niri.kdl"
user = "greeter"
