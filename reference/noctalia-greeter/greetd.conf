[terminal]
vt = 1

# Noctalia Greeter i sin egen wlroots-compositor. Ingen autologin: utan
# losenord kan pam_gnome_keyring inte lasa upp keyringen, och disken ar
# okrypterad.
#
# noctalia-greeter-session, inte noctalia-greeter: wrappern startar
# compositorn som skapar WAYLAND_DISPLAY innan klienten startar.
#
# Filen heter greetd.conf och inte config.toml med flit. greetd letar efter
# greetd.conf FORST, och config.toml skrivs over vid paketuppgradering - se
# ../greetd/README.md.
#
# Felsokning: byt command till
#   env NOCTALIA_GREETER_LOG=stderr WLR_LOG=info /usr/bin/noctalia-greeter-session
[default_session]
command = "/usr/bin/noctalia-greeter-session"
user = "greeter"
