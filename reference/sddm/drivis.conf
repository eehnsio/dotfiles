; /usr/share/sddm/themes/silent/configs/drivis.conf
; Temats default.conf (v1.5.0) med Drivis-paletten
; (noctalia/.config/noctalia/palettes/Drivis.json) inlagd.
;
; Filen MASTE vara komplett. En nyckel som saknas faller INTE tillbaka pa
; default.conf: 74 av 205 nycklar i components/Config.qml har ingen reserv
; och blir 0/""/false. LoginArea margin saknades och blev 0 - rutan fastes
; da i overkanten i stallet for att centreras (-1).
;
; Strangar MASTE ha dubbla citattecken (SilentSDDM issue #77).

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "drivis.jpg"
use-background-color = false
background-color = "#000000"
blur = 32
brightness = -0.15
saturation = 0.0

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "hh:mm"
font-family = "RedHatDisplay"
font-size = 70
font-weight = 900
color = "#c8cdd6"

[LockScreen.Date]
display = true
format = "dddd d MMMM yyyy"
locale = "sv_SE"
font-family = "RedHatDisplay"
font-size = 14
font-weight = 600
color = "#aeb4c0"
margin-top = -15

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "Tryck på valfri tangent"
font-family = "RedHatDisplay"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "#aeb4c0"
paint-icon = true
spacing = 0

[LoginScreen]
background = "drivis.jpg"
use-background-color = false
background-color = "#000000"
blur = 48
brightness = -0.3
saturation = 0.0

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 2
inactive-border-size = 0
active-border-color = "#7fc8ff"
inactive-border-color = "#FFFFFF"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "RedHatDisplay"
font-size = 16
font-weight = 700
color = "#c8cdd6"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 200
height = 30
display-icon = true
font-family = "RedHatDisplay"
font-size = 12
icon = "password.svg"
icon-size = 16
content-color = "#c8cdd6"
background-color = "#16181d"
background-opacity = 0.6
border-size = 1
border-color = "#4a505c"
border-radius-left = 10
border-radius-right = 10
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#16181d"
background-opacity = 0.6
active-background-color = "#7fc8ff"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#c8cdd6"
active-content-color = "#0b1016"
border-size = 1
border-color = "#4a505c"
border-radius-left = 10
border-radius-right = 10
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "RedHatDisplay"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Loggar in"
font-family = "RedHatDisplay"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#7fc8ff"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "RedHatDisplay"
font-size = 11
font-weight = 400
normal-color = "#aeb4c0"
warning-color = "#d8a657"
error-color = "#e06c75"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 30
border-radius = 5
spacing = 10
font-family = "RedHatDisplay"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = true
margin = 5
background-color = "#16181d"
background-opacity = 0.85
active-option-background-color = "#2b6d95"
active-option-background-opacity = 1.0
content-color = "#c8cdd6"
active-content-color = "#d2d7df"
font-family = "RedHatDisplay"
border-size = 0
border-color = "#FFFFFF"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 200
background-color = "#FFFFFF"
background-opacity = 0.0
active-background-opacity = 0.2
content-color = "#c8cdd6"
active-content-color = "#FFFFFF"
border-size = 0
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "#FFFFFF"
background-opacity = 0.0
active-background-opacity = 0.2
content-color = "#c8cdd6"
active-content-color = "#FFFFFF"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 0
background-color = "#FFFFFF"
background-opacity = 0.0
active-background-opacity = 0.2
content-color = "#c8cdd6"
active-content-color = "#FFFFFF"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#FFFFFF"
background-opacity = 0.0
active-background-opacity = 0.2
content-color = "#c8cdd6"
active-content-color = "#FFFFFF"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#FFFFFF"
background-opacity = 0.15
key-content-color = "#FFFFFF"
key-color = "#FFFFFF"
key-opacity = 0.15
key-active-background-color = "#FFFFFF"
key-active-opacity = 0.30
selection-background-color = "#CCCCCC"
selection-content-color = "#FFFFFF"
primary-color = "#FFF"
border-size = 0
border-color = "#000000"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "RedHatDisplay"
font-size = 11
content-color = "#c8cdd6"
background-color = "#16181d"
background-opacity = 0.85
border-radius = 5
disable-user = false
disable-login-button = false
