# /etc/sddm.conf.d/silent.conf - se README.md bredvid.

[General]
# Ingen Xorg pa maskinen: greetern kor under weston i stallet.
DisplayServer=wayland
InputMethod=qtvirtualkeyboard
# QML2_IMPORT_PATH: temat hittar inte sina egna komponenter utan den.
# INTE QT_WAYLAND_SHELL_INTEGRATION=layer-shell trots temats wiki: pluginet
# kommer fran layer-shell-qt, som inte ar installerat. Qt dor da med qFatal
# innan nagot ritas (SIGABRT, 2026-10-08) och SDDM ger svart skarm.
# Tomma LIBVA_DRIVER_NAME/QT_MULTIMEDIA_PREFERRED_PLUGINS: wikins fix for
# segfault pa Nvidia. Ofarliga aven om de inte behovs.
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/silent/components/,QT_IM_MODULE=qtvirtualkeyboard,LIBVA_DRIVER_NAME=,QT_MULTIMEDIA_PREFERRED_PLUGINS=

[Wayland]
# Egen weston.ini for tangentbordslayouten: losenordet skrivs har, och fel
# layout gar inte att skilja fran fel losenord.
CompositorCommand=weston --shell=kiosk --config=/etc/sddm/weston.ini

[Theme]
Current=silent
