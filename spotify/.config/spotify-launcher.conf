[spotify]
# Spotify-klienten valjer X11 sjalv och skickar --ozone-platform=x11 till sina
# egna delprocesser, oavsett ELECTRON_OZONE_PLATFORM_HINT — den variabeln ar
# Electron-specifik och klienten ar CEF. Flaggorna nedan overstyr det.
extra_arguments = ["--enable-features=UseOzonePlatform", "--ozone-platform=wayland"]
