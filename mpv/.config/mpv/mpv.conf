# mpv — https://mpv.io/manual/stable/
#
# Fönstret öppnas flytande av en window-rule i niri/.config/niri/config.kdl.
# Den regeln sätter medvetet ingen storlek, så måtten härifrån är de som gäller.

# Stanna kvar på sista bildrutan när klippet tar slut i stället för att avsluta.
# mpv:s standard är att processen dör vid filslut, vilket får fönstret att
# försvinna mitt framför en. "yes" pausar på sista rutan; q stänger som vanligt.
keep-open=yes

# Fönstret följer klippet. mpv ber om videons egen upplösning, och de här två
# sätter bara tak och golv som andel av skärmen den öppnas på. Bildförhållandet
# behålls — värdena är en ram att få plats i, inte en storlek att sträckas till.
#
# Utan taket öppnas ett 4K-klipp större än skärmen; utan golvet blir ett gammalt
# 480p-klipp ett frimärke.
autofit-larger=60%x60%
autofit-smaller=25%x25%
