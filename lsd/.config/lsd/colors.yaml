# Fargerna anges som ANSI-index (0-15), inte hex.
#
# Da foljer lsd terminalens aktiva tema av sig sjalvt, precis som zsh-prompten
# gor. Byter du ghostty-tema flyttar lsd med utan att den har filen rors. En
# hardkodad hex-palett skulle i stallet lasa lsd vid ett tema och sticka ut sa
# fort resten av skalet bytte utseende.
#
#   0 svart   1 rod     2 gron    3 gul
#   4 bla     5 magenta 6 cyan    7 vit
#   8 gra (dampad)      9-15 ljusa varianter

user: 6
group: 8

permission:
  read: 2
  write: 1
  exec: 3
  exec-sticky: 5
  no-access: 8
  octal: 4
  acl: 5
  context: 5

date:
  hour-old: 2
  day-old: 4
  older: 8

size:
  none: 8
  small: 2
  medium: 3
  large: 1

inode:
  valid: 5
  invalid: 8

links:
  valid: 5
  invalid: 1

tree-edge: 8

git-status:
  default: 8
  unmodified: 8
  ignored: 8
  new-in-index: 2
  new-in-workdir: 2
  typechange: 3
  deleted: 1
  renamed: 4
  modified: 3
  conflicted: 1
