# Fargerna anges som ANSI-index (0-15), inte hex.
#
# Da foljer lsd terminalens aktiva tema av sig sjalvt, precis som zsh-prompten
# gor. Byter du ghostty-tema flyttar lsd med utan att den har filen rors.
#
#   0 svart   1 rod     2 gron    3 gul
#   4 bla     5 magenta 6 cyan    7 vit
#   8 gra (dampad)      9-15 ljusa varianter
#
# PRINCIPEN: metadata ar bakgrundsbrus och gar till 8. Filnamnet ar det man
# laser, och lsd fargar det redan efter filtyp. Accenten 6 sparas till de fa
# fall dar metadata faktiskt sager nagot ovantat — att en fil ar exekverbar,
# ovanligt stor, eller andrad for en stund sedan. I noctalia-paletten ar
# index 6 = #7dcfff, alltsa i praktiken samma bla som niris fokusring.
#
# Rott behalls bara for det som ar illa pa riktigt: raderat och konflikt.
# Det ar semantisk farg, inte accent, och de tva ska inte blandas ihop.

user: 8
group: 8

permission:
  read: 8
  write: 8
  exec: 6
  exec-sticky: 6
  no-access: 8
  octal: 8
  acl: 8
  context: 8

date:
  hour-old: 6
  day-old: 8
  older: 8

size:
  none: 8
  small: 8
  medium: 8
  large: 6

inode:
  valid: 8
  invalid: 8

links:
  valid: 8
  invalid: 8

tree-edge: 8

git-status:
  default: 8
  unmodified: 8
  ignored: 8
  new-in-index: 6
  new-in-workdir: 6
  typechange: 6
  renamed: 6
  modified: 6
  deleted: 1
  conflicted: 1
