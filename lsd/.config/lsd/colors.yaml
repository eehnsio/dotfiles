# Fargerna anges som ANSI-index (0-15), inte hex.
#
# Da foljer lsd terminalens aktiva tema av sig sjalvt, precis som zsh-prompten
# gor. Byter du ghostty-tema flyttar lsd med utan att den har filen rors.
#
#   0 svart   1 rod     2 gron    3 gul
#   4 bla     5 magenta 6 cyan    7 vit
#   8 gra (dampad)      9-15 ljusa varianter
#
# PRINCIPEN: metadata ar bakgrundsbrus och gar till 8. Filnamnet ar det man
# laser, och lsd fargar det redan efter filtyp. Accenten 6 sparas till det som
# ar sallsynt — tander den pa nagot som finns pa varje rad blir den brus i sin
# tur. I noctalia-paletten ar index 6 = #7dcfff, i praktiken samma bla som
# niris fokusring.
#
# Hela rattighetsblocket ar darfor gratt, aven exec-biten. Kataloger ar ALLTID
# exekverbara, sa i en mapp med mest kataloger tandes accenten pa varenda rad.
# Och for filer bar den ingen egen information: lsd fargar redan namnet gront
# nar nagot ar korbart, vilket ar bade tydligare och tar mindre plats.
#
# Datumet varieras med ljusstyrka i stallet for kulor: 7 ar samma neutrala gra
# som 8, bara ljusare. Nyss andrat trader fram utan att lagga till en farg till.
#
# Rott behalls bara for det som ar illa pa riktigt: raderat och konflikt.
# Det ar semantisk farg, inte accent, och de tva ska inte blandas ihop.

user: 8
group: 8

permission:
  read: 8
  write: 8
  exec: 8
  exec-sticky: 8
  no-access: 8
  octal: 8
  acl: 8
  context: 8

date:
  hour-old: 7
  day-old: 8
  older: 8

size:
  none: 8
  small: 8
  medium: 8
  large: 6

inode:
  valid: 8
  invalid: 8

links:
  valid: 8
  invalid: 8

tree-edge: 8

git-status:
  default: 8
  unmodified: 8
  ignored: 8
  new-in-index: 6
  new-in-workdir: 6
  typechange: 6
  renamed: 6
  modified: 6
  deleted: 1
  conflicted: 1
